name: CI / Automated Safe Deployment Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job 1: Static Code Analysis, Formatting & Dependency Security Audit
  # ==============================================================================
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality (ESLint)
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run lint:check

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

  # ==============================================================================
  # Job 2: Automated Unit, Integration & Regression Tests
  # ==============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite with Code Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          AUTH_ENABLED: true
          JWT_SECRET: ci_test_runner_jwt_secret_min_32_characters_long_12345
          APP_PASSWORD: test_user_password_ci
          ADMIN_PASSWORD: test_admin_password_ci

  # ==============================================================================
  # Job 3: Docker Container Build Verification (Smoke Test)
  # ==============================================================================
  docker-smoke-build:
    name: Docker Container Build Smoke Test
    needs: [lint-and-audit, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adobe-cloud-downloader:ci-verification
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # Job 4: Automatischer Pull Request auf 'main' nach erfolgreichem CI-Durchlauf
  # ==============================================================================
  auto-pr:
    name: Create or Update Pull Request to main
    needs: [lint-and-audit, test, docker-smoke-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check or Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head develop --base main --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "✓ Offener PR #$EXISTING_PR existiert bereits. Neue Commits wurden von GitHub automatisch angehängt."
          else
            echo "Kein offener PR gefunden. Erstelle neuen Pull Request von develop auf main..."
            gh pr create \
              --head develop \
              --base main \
              --title "🚀 Release Candidate: develop -> main" \
              --body "### 🚀 Automatisch erstellter Release-PR

          Alle automatisierten CI-Qualitätsprüfungen auf dem \`develop\`-Branch waren erfolgreich.

          #### Durchgeführte Prüfungen:
          - ✅ **Lint & Security Audit:** Keine kritischen Schwachstellen oder Syntax-Fehler.
          - ✅ **Automatisierte Testsuite:** Alle 58 Unit- & Integrationstests bestanden.
          - ✅ **Docker Container Build:** Produktions-Image erfolgreich gebaut.

          > ℹ️ *Hinweis: Weitere Commits auf \`develop\` werden diesem PR automatisch hinzugefügt, bis er geprüft und gemergt wird.*"
            echo "✓ Pull Request erfolgreich erstellt!"
          fi