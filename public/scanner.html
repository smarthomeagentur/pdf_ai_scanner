<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Live Dokumentenscanner</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json?v=2" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg?v=2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scanner" />

  <!-- Roboto Google Font for Material You -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/scanner.css?v=20260827_shutter_enlarged_v85" />
  <link rel="stylesheet" href="/md3-theme.css?v=20260819_10" />
  <script>
    window.onOpenCvReady = function() {
      if (typeof window.initOpenCvRuntime === "function") {
        window.initOpenCvRuntime();
      } else {
        window.openCvIsLoaded = true;
      }
    };
  </script>
</head>

<body>
  <div class="scanner-container">
    <!-- Sticky Modern Header -->
    <div class="scanner-header sticky-top d-flex justify-content-between align-items-center px-3 py-2">
      <a href="/" class="back-link m-0 d-flex align-items-center gap-1" title="Zurück zur Belegübersicht">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        <span>Zurück</span>
      </a>
      <div class="d-flex gap-2 align-items-center">
        <!-- Bildquellen-Wähler: Live Kamera oder Test-Bilder (nur im Debug-Modus sichtbar) -->
        <select id="sourceSelect" class="form-select form-select-sm" style="width: auto; max-width: 135px; font-weight: 500; font-size: 0.82rem; border-radius: 8px; display: none;" title="Bildquelle (Kamera oder Test-Bild)">
          <option value="camera">📷 Live Kamera</option>
          <option value="edge1.jpg">🧪 edge1.jpg</option>
          <option value="edge2.jpg">🧪 edge2.jpg</option>
          <option value="edge3.jpg">🧪 edge3.jpg</option>
          <option value="edge4.jpg">🧪 edge4.jpg</option>
        </select>

        <!-- Modus Umschalter (KI: ONNX / OpenCV) -->
        <button id="engineToggleBtn"
          class="mode-toggle-btn"
          title="Erkennungs-Engine umschalten (KI / OpenCV)">
          <span class="material-symbols-outlined mode-icon" id="modeIcon">psychology</span>
          <span class="mode-text" id="modeText">KI: ONNX</span>
          <span class="spinner-border spinner-border-sm mode-spinner" id="modeSpinner" style="display: none;" role="status"></span>
        </button>

        <button id="autoCaptureBtn"
          class="scanner-control-btn auto-capture-toggle-btn"
          title="Automatisches Auslösen (An/Aus)">
          <span class="material-symbols-outlined" style="font-size: 18px;">document_scanner</span>
          <span>Auto: Aus</span>
        </button>
        <button id="filterMenuToggleBtn" class="scanner-control-btn scanner-icon-btn" onclick="
              document.getElementById('filterMenu').open =
                !document.getElementById('filterMenu').open
            " title="Einstellungen anpassen">
          <span class="material-symbols-outlined" style="font-size: 19px;">tune</span>
        </button>
      </div>
    </div>

    <!-- Dropdown Einstellungen (Sticky directly below header) -->
    <details id="filterMenu" class="bg-light text-start shadow-sm position-sticky"
      style="top: 60px; z-index: 1020; border-bottom: 2px solid #ddd">
      <summary class="text-secondary fw-bold p-3 m-0" style="cursor: pointer; background: #f8f9fa; display: none">
        <span class="material-symbols-outlined" style="vertical-align: middle;">tune</span> Filtereinstellungen anzeigen
      </summary>
      <div class="px-3 pb-3 border-top pt-2">
        <!-- Bild-Filter ist jetzt exklusiv im Preview-Screen. Intern halten wir den State fest: -->
        <input type="hidden" id="algorithmSelect" value="auto" />

        <label class="form-label mb-0 mt-1 small">Erkennungs-Sensitivität: <span id="sensitivityVal">85%</span></label>
        <input type="range" class="modern-slider" id="sensitivitySlider" min="10" max="100" value="85" />

        <div id="cvSettingsGroup" style="display: none;" class="mt-2">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="cvAutoThresholds" checked>
            <label class="form-check-label small fw-bold" for="cvAutoThresholds">OpenCV Auto-Canny & CLAHE</label>
          </div>
        </div>

        <label class="form-label mb-0 mt-2 small">Rahmen-Trägheit (Anti-Flicker):
          <span id="smoothingVal">40%</span></label>
        <input type="range" class="modern-slider" id="smoothingSlider" min="1" max="100" value="40" />

        <hr class="my-3" />
        <h6 class="text-secondary mb-2 small fw-bold">Weitere Optionen</h6>
      </div>
    </details>

    <!-- Mini-Vorschau Overlay der bereits gescannten Seiten (Multi-Page Strip) -->
    <div id="scannedPagesStrip" class="scanned-pages-strip shadow-sm" style="display: none;">
      <div class="d-flex align-items-center gap-2 flex-shrink-0">
        <span class="badge bg-primary d-flex align-items-center gap-1 py-1 px-2" style="font-size: 0.82rem;">
          <span class="material-symbols-outlined" style="font-size: 15px;">description</span>
          <span id="scannedCountBadge">0 Seiten</span>
        </span>
      </div>
      <div id="scannedThumbsList" class="scanned-thumbs-list">
        <!-- Dynamisch eingefügte Miniaturansichten -->
      </div>
      <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0">
        <button id="stripFinishBtn" class="btn btn-sm btn-success d-flex align-items-center gap-1 fw-bold shadow-sm" style="font-size: 0.82rem; padding: 4px 10px;">
          <span class="material-symbols-outlined" style="font-size: 16px;">check_circle</span>
          <span>Abschließen</span>
        </button>
      </div>
    </div>

    <div id="opencv-loading">
      <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
      <br />
      Kamera & Optik werden geladen...
    </div>

    <!-- Video füllt den restlichen Bildschirm -->
    <div class="video-wrapper" id="video-wrapper">
      <video id="video" autoplay playsinline></video>
      <img id="sampleImage" style="display: none; width: 100%; height: 100%; object-fit: contain;" alt="Test-Bild" />
      <canvas id="overlay"></canvas>
    </div>

    <!-- Review Section für manuelles Croppen -->
    <div id="manual-review-section" class="manual-review-section">
      <!-- Close button (Abbrechen) oben rechts absolut positioniert im Review-Panel -->
      <button id="cancelReviewCrossBtn"
        class="btn btn-sm btn-outline-secondary position-absolute d-flex align-items-center justify-content-center"
        style="top: 12px; right: 12px; width: 36px; height: 36px; padding: 0; border-radius: 50%; z-index: 1040; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px);" title="Schließen">
        <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
      </button>

      <!-- Bild-Vorschau Container mit skalierendem Canvas -->
      <div class="review-preview-container">
        <div class="review-canvas-wrapper">
          <canvas id="reviewCanvas"></canvas>
          <canvas id="reviewOverlay"></canvas>
          <button id="rescanBtn" class="floating-rescan-btn" title="Ecken neu erkennen">
            <span class="material-symbols-outlined" style="font-size: 16px;">auto_fix_high</span>
            <span>Ecken neu erkennen</span>
          </button>
        </div>
      </div>

      <div id="previewLoadingText" class="text-primary fw-bold text-center my-1" style="display: none; font-size: 0.85em">
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Warten auf Vorschau...
      </div>

      <!-- Controls Panel unten -->
      <div class="review-controls-container">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-2 flex-wrap">
          <div class="d-flex align-items-center gap-1">
            <button id="rotateReviewLeftBtn" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" style="height: 34px; border-radius: 8px;" title="90° nach links drehen">
              <span class="material-symbols-outlined" style="font-size: 17px;">rotate_left</span>
            </button>
            <button id="rotateReviewRightBtn" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" style="height: 34px; border-radius: 8px;" title="90° nach rechts drehen">
              <span class="material-symbols-outlined" style="font-size: 17px;">rotate_right</span>
            </button>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button id="colorFilterOriginalBtn" class="btn btn-sm btn-outline-secondary filter-preset-btn active" data-filter="original" style="height: 34px; border-radius: 8px; font-size: 12px;">Farbe</button>
            <button id="colorFilterCleanBtn" class="btn btn-sm btn-outline-secondary filter-preset-btn" data-filter="clean" style="height: 34px; border-radius: 8px; font-size: 12px;">Dokument</button>
            <button id="colorFilterBwBtn" class="btn btn-sm btn-outline-secondary filter-preset-btn" data-filter="bw" style="height: 34px; border-radius: 8px; font-size: 12px;">S/W</button>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2 review-action-row">
          <button id="discardScanBtn" class="btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center gap-1" style="height: 38px; border-radius: 8px; padding: 4px 12px;" title="Seite verwerfen">
            <span class="material-symbols-outlined" style="font-size: 17px;">delete</span>
            <span>Verwerfen</span>
          </button>
          <button id="addPageBtn" class="action-btn-addpage d-flex align-items-center justify-content-center gap-1" title="Weitere Seite scannen">
            <span class="material-symbols-outlined" style="font-size: 18px;">add_to_photos</span>
            <span>+ Seite</span>
          </button>
          <button id="finishScanBtn" class="action-btn-finish d-flex align-items-center justify-content-center gap-1" title="Scans fertigstellen">
            <span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
            <span>Abschließen</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Scanner Info / Loader -->
    <div id="loader" class="mt-auto mb-5 p-4 bg-white" style="display: none; width: 100%; text-align: center">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted" id="loader-status">
        Dokument wird beschnitten und OCR-verarbeitet...
      </p>
    </div>

    <!-- Großer Auto-Countdown Indikator -->
    <div id="auto-countdown" style="
          display: none;
          position: fixed;
          top: 40%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 1015;
          font-size: 15vw;
          color: white;
          font-weight: bold;
          text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
          pointer-events: none;
        ">
      2
    </div>

    <!-- Floating Modern Shutter Trigger -->
    <button id="captureBtn" class="modern-shutter-btn" style="display: none;" disabled title="Dokument scannen">
      <div class="shutter-inner">
        <span class="material-symbols-outlined">photo_camera</span>
      </div>
    </button>

    <!-- Floating Modern Taschenlampe -->
    <button id="torchBtn" class="modern-torch-btn" style="display: none;" title="Taschenlampe (Aus/An/Auto)">
      <span class="material-symbols-outlined">flashlight_off</span>
      <small>Aus</small>
    </button>
  </div>

  <!-- ONNX Runtime Web (lokal von vendor oder CDN-Fallback) -->
  <script src="/vendor/onnx/ort.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js'"></script>

  <!-- Scanner-Logik mit KI- & OpenCV-Pipeline -->
  <script src="/scanner.js?v=20260827_shutter_fix_v87"></script>

  <!-- OpenCV.js im Hintergrund (defer) für Fallback & klassischen Modus -->
  <script defer src="https://docs.opencv.org/4.8.0/opencv.js" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.2/dist/opencv.js';" onload="window.onOpenCvReady && window.onOpenCvReady()" type="text/javascript"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>

</html>
