<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Dokumentenscanner</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json?v=2" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg?v=2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scanner" />

  <!-- Roboto Google Font for Material You -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/scanner.css?v=20260819_2" />
  <link rel="stylesheet" href="/md3-theme.css?v=20260819_2" />
  <script>
    window.onOpenCvReady = function() {
      if (typeof window.initOpenCvRuntime === "function") {
        window.initOpenCvRuntime();
      } else {
        window.openCvIsLoaded = true;
      }
    };
  </script>
</head>

<body>
  <div class="scanner-container">
    <!-- Sticky Header -->
    <div class="sticky-top bg-white border-bottom shadow-sm d-flex justify-content-between align-items-center p-3">
      <a href="/" class="back-link m-0 d-flex align-items-center gap-1"><span
          class="material-symbols-outlined">arrow_back</span> Home</a>
      <div class="d-flex gap-2 align-items-center">
        <!-- Bildquellen-Wähler: Live Kamera oder Test-Bilder (nur im Debug-Modus sichtbar) -->
        <select id="sourceSelect" class="form-select form-select-sm" style="width: auto; max-width: 135px; font-weight: 500; font-size: 0.82rem; border-radius: 8px; display: none;" title="Bildquelle (Kamera oder Test-Bild)">
          <option value="camera">📷 Live Kamera</option>
          <option value="edge1.jpg">🧪 edge1.jpg</option>
          <option value="edge2.jpg">🧪 edge2.jpg</option>
          <option value="edge3.jpg">🧪 edge3.jpg</option>
          <option value="edge4.jpg">🧪 edge4.jpg</option>
        </select>

        <!-- Modus Umschalter (KI: ONNX / OpenCV) -->
        <button id="engineToggleBtn"
          class="btn btn-sm btn-primary d-flex align-items-center justify-content-center gap-1 mode-toggle-btn"
          title="Erkennungs-Engine umschalten (KI / OpenCV)">
          <span class="material-symbols-outlined mode-icon" id="modeIcon">psychology</span>
          <span class="mode-text" id="modeText">KI: ONNX</span>
          <span class="spinner-border spinner-border-sm mode-spinner" id="modeSpinner" style="display: none;" role="status"></span>
        </button>

        <button id="autoCaptureBtn"
          class="btn btn-sm btn-primary d-flex align-items-center justify-content-center gap-2" style="
              font-weight: 500;
              font-size: 1rem;
              padding: 8px 16px !important;
              min-width: 130px; /* Fixed width prevents resize when text changes */
              height: 40px; /* Fixed height against padding jumps */
            " title="Auto-Capture (An/Aus)">
          <span class="material-symbols-outlined">document_scanner</span> <span>Auto: An</span>
        </button>
        <button class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center" onclick="
              document.getElementById('filterMenu').open =
                !document.getElementById('filterMenu').open
            " style="padding: 6px; border-radius: 50%;">
          <span class="material-symbols-outlined">tune</span>
        </button>
      </div>
    </div>

    <!-- Dropdown Einstellungen (Sticky directly below header) -->
    <details id="filterMenu" class="bg-light text-start shadow-sm position-sticky"
      style="top: 60px; z-index: 1020; border-bottom: 2px solid #ddd">
      <summary class="text-secondary fw-bold p-3 m-0" style="cursor: pointer; background: #f8f9fa; display: none">
        <span class="material-symbols-outlined" style="vertical-align: middle;">tune</span> Filtereinstellungen anzeigen
      </summary>
      <div class="px-3 pb-3 border-top pt-2">
        <!-- Bild-Filter ist jetzt exklusiv im Preview-Screen. Intern halten wir den State fest: -->
        <input type="hidden" id="algorithmSelect" value="auto" />

        <label class="form-label mb-0 mt-1 small">Erkennungs-Sensitivität: <span id="sensitivityVal">85%</span></label>
        <input type="range" class="modern-slider" id="sensitivitySlider" min="10" max="100" value="85" />

        <div id="cvSettingsGroup" style="display: none;" class="mt-2">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="cvAutoThresholds" checked>
            <label class="form-check-label small fw-bold" for="cvAutoThresholds">OpenCV Auto-Canny & CLAHE</label>
          </div>
        </div>

        <label class="form-label mb-0 mt-2 small">Rahmen-Trägheit (Anti-Flicker):
          <span id="smoothingVal">40%</span></label>
        <input type="range" class="modern-slider" id="smoothingSlider" min="1" max="100" value="40" />

        <hr class="my-3" />
        <h6 class="text-secondary mb-2 small fw-bold">Weitere Optionen</h6>
      </div>
    </details>

    <div id="opencv-loading">
      <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
      <br />
      Kamera & Optik werden geladen...
    </div>

    <!-- Video füllt den restlichen Bildschirm -->
    <div class="video-wrapper" id="video-wrapper">
      <video id="video" autoplay playsinline></video>
      <img id="sampleImage" style="display: none; width: 100%; height: 100%; object-fit: contain;" alt="Test-Bild" />
      <canvas id="overlay"></canvas>
    </div>

    <!-- Review Section für manuelles Croppen -->
    <div id="manual-review-section" class="manual-review-section">
      <!-- Close button (Abbrechen) oben rechts absolut positioniert im Review-Panel -->
      <button id="cancelReviewCrossBtn"
        class="btn btn-sm btn-outline-secondary position-absolute d-flex align-items-center justify-content-center"
        style="top: 12px; right: 12px; width: 36px; height: 36px; padding: 0; border-radius: 50%; z-index: 1040; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px);" title="Schließen">
        <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
      </button>

      <!-- Bild-Vorschau Container mit skalierendem Canvas -->
      <div class="review-preview-container">
        <div class="review-canvas-wrapper">
          <canvas id="reviewCanvas"></canvas>
          <canvas id="reviewOverlay"></canvas>

          <!-- Floating Kantenerkennung Button direkt auf der Bildvorschau -->
          <button id="rescanBtn" class="floating-rescan-btn" title="Kantenerkennung erneut ausführen">
            <span class="material-symbols-outlined" style="font-size: 18px;">crop</span>
            <span>Kantenerkennung</span>
          </button>
        </div>
      </div>

      <div id="previewLoadingText" class="text-primary fw-bold text-center my-1" style="display: none; font-size: 0.85em">
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Warten auf Vorschau...
      </div>

      <!-- Controls Container unten (Immer sichtbar) -->
      <div class="review-controls-container">
        <div class="input-group input-group-sm mb-2 shadow-sm filter-row">
          <span class="input-group-text bg-light fw-bold" style="font-size: 0.85em">🎨 Filter</span>
          <select id="previewAlgorithmSelect" class="form-select text-primary fw-bold" style="font-size: 0.85em"
            onchange="
                document.getElementById('algorithmSelect').value = this.value;
                updatePreviewFilter();
              ">
            <option value="auto">✨ Auto-Erkennung (Empfohlen)</option>
            <option value="magic_color">🌈 Magic Color</option>
            <option value="clean_bg">📄 Clean Background (Dokument)</option>
            <option value="document">📑 Schwarz-Weiß (Text)</option>
            <option value="photo">🖼️ Foto / Farbe</option>
            <option value="color">원본 Original (Unverändert)</option>
          </select>
        </div>

        <!-- Alle Aktions-Buttons in einer einzigen kompakten Zeile -->
        <div class="review-action-row d-flex gap-2 w-100 align-items-center">
          <!-- Download Icon Button -->
          <button class="btn btn-outline-secondary d-flex align-items-center justify-content-center action-btn-download" id="downloadOnlyBtn" title="Nur Herunterladen (ohne KI)">
            <span class="material-symbols-outlined" style="font-size: 22px;">download</span>
          </button>
          <button class="btn btn-outline-primary d-flex align-items-center justify-content-center gap-1 action-btn-addpage" id="nextPageBtn">
            <span class="material-symbols-outlined" style="font-size: 20px;">note_add</span>
            <span>Seite hinzufügen</span>
          </button>
          <!-- Abschließen mit KI -->
          <button class="btn btn-success d-flex align-items-center justify-content-center gap-1 fw-bold text-white shadow action-btn-finish" id="finishScanBtn">
            <span class="material-symbols-outlined" style="font-size: 20px;">check_circle</span>
            <span>Abschließen</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Scanner Info / Loader -->
    <div id="loader" class="mt-auto mb-5 p-4 bg-white" style="display: none; width: 100%; text-align: center">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted" id="loader-status">
        Dokument wird beschnitten und OCR-verarbeitet...
      </p>
    </div>

    <!-- Großer Auto-Countdown Indikator -->
    <div id="auto-countdown" style="
          display: none;
          position: fixed;
          top: 40%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 1015;
          font-size: 15vw;
          color: white;
          font-weight: bold;
          text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.8);
          pointer-events: none;
        ">
      2
    </div>

    <!-- Floating Button für besseres Mobile-Bedienen -->
    <button id="captureBtn" class="btn btn-primary" style="
          display: none;
          position: fixed;
          bottom: 40px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 999;
          max-width: 500px;
          width: calc(100% - 60px);
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
          font-size: 1.1rem;
          padding: 14px;
        " disabled>
      <span class="material-symbols-outlined pe-2">photo_camera</span> Dokument scannen
    </button>

    <!-- Floating Taschenlampe -->
    <button id="torchBtn" class="btn d-flex align-items-center justify-content-center flex-column" style="
          display: none;
          position: fixed;
          bottom: 110px;
          right: 30px;
          z-index: 999;
          border-radius: 50%;
          width: 50px;
          height: 50px;
          padding: 0;
          background: #fff;
          border: 1px solid #ddd;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
          color: #555;
          line-height: 1;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
          font-size: 1.1rem;
          backdrop-filter: blur(4px);
          align-items: center;
          justify-content: center;
          flex-direction: column;
          text-align: center;
          line-height: 1.2;
        " title="Taschenlampe (Aus/An/Auto)">
      <span class="material-symbols-outlined pb-1">flashlight_on</span><small style="font-size: 8px">Auto</small>
    </button>
  </div>

  <!-- ONNX Runtime Web (lokal von vendor oder CDN-Fallback) -->
  <script src="/vendor/onnx/ort.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js'"></script>

  <!-- Scanner-Logik mit KI- & OpenCV-Pipeline -->
  <script src="/scanner.js?v=20260819_16"></script>

  <!-- OpenCV.js im Hintergrund (defer) für Fallback & klassischen Modus -->
  <script defer src="https://docs.opencv.org/4.8.0/opencv.js" onload="window.onOpenCvReady && window.onOpenCvReady()" type="text/javascript"></script>
</body>

</html>
